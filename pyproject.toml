[project]
name = "expedition"
version = "0.1.0"
description = "Universal Web Scraping Library"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "cloudscraper>=1.2.71",
  "fastapi>=0.110.0",
  "uvicorn>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.26.0",
  "pytest>=8.0.0",
]
render = [
  "playwright>=1.43.0",
]

[project.scripts]
expedition = "expedition.cli:main"
embark = "embark.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "expedition"}

[tool.setuptools.packages.find]
where = ["expedition"]
